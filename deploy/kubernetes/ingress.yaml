apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mermaid-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: mermaid-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: mermaid.kshyst.ir
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mermaid-studio
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mermaid
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mermaid.kshyst.ir
      secretName: mermaid-tls
  rules:
    - host: mermaid.kshyst.ir
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mermaid-studio
                port:
                  number: 80
