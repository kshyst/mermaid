apiVersion: apps/v1
kind: Deployment
metadata:
  name: mermaid-studio
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mermaid-studio
  template:
    metadata:
      labels:
        app: mermaid-studio
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: control-1
      containers:
        - name: frontend
          image: mermaid-web
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: mermaid-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: mermaid-studio
spec:
  selector:
    app: mermaid-studio
  ports:
    - name: http
      port: 80
      targetPort: http
