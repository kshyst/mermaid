apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagrams-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: diagrams-api
  template:
    metadata:
      labels:
        app: diagrams-api
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: control-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: mermaid-api
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_PATH
              value: /data/diagrams.sqlite3
            - name: JWT_SECRET_PATH
              value: /data/jwt-secret
            - name: SECURE_COOKIES
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mermaid-data
---
apiVersion: v1
kind: Service
metadata:
  name: diagrams-api
spec:
  selector:
    app: diagrams-api
  ports:
    - name: http
      port: 8000
      targetPort: http
