apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-from-traefik
spec:
  podSelector:
    matchLabels:
      app: mermaid-studio
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-frontend
spec:
  podSelector:
    matchLabels:
      app: diagrams-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mermaid-studio
      ports:
        - protocol: TCP
          port: 8000
