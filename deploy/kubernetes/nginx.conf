# Only Traefik pods can reach this frontend (see network-policy.yaml).
# Default K3s pod CIDR; update this if the cluster uses a custom pod CIDR.
set_real_ip_from 10.42.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_x_forwarded_proto $request_scheme {
  default $scheme;
  https https;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 8m;
  location /api/ {
    proxy_pass http://diagrams-api:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $request_scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
  location / { try_files $uri $uri/ /index.html; }
  location /assets/ { expires 1y; add_header Cache-Control "private, immutable"; }
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy same-origin;
}
