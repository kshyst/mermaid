server {
    listen 80;
    server_name mermaid.kshyst.ir;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://mermaid.kshyst.ir$request_uri; }
}
server {
    listen 443 ssl;
    server_name mermaid.kshyst.ir;
    ssl_certificate /etc/letsencrypt/live/mermaid.kshyst.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mermaid.kshyst.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
