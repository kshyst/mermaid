apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mermaid
  namespace: argocd
spec:
  project: mermaid
  source:
    repoURL: https://github.com/kshyst/mermaid.git
    targetRevision: deploy/production
    path: .
    directory:
      include: manifests.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mermaid
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
