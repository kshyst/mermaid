apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mermaid
  namespace: argocd
spec:
  description: Mermaid production application
  sourceRepos:
    - https://github.com/kshyst/mermaid.git
  destinations:
    - namespace: mermaid
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: traefik.io
      kind: Middleware
  orphanedResources:
    warn: true
