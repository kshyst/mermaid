services:
  mermaid-studio:
    build: .
    ports:
      - "127.0.0.1:3010:80"
    restart: always
    depends_on:
      diagrams-api:
        condition: service_healthy
  diagrams-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    volumes:
      - ./data:/data
