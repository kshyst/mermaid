services:
  mermaid-studio:
    build: .
    ports:
      - "3010:80"
    restart: unless-stopped
    depends_on:
      diagrams-api:
        condition: service_healthy
    secrets:
      - nginx_htpasswd
  diagrams-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    volumes:
      - ./data:/data
secrets:
  nginx_htpasswd:
    file: ./.nginx-auth/htpasswd
